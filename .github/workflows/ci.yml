name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q kit tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # MIGRATION NOTE (v3): a v2 kit was packed into a .zip; a v3 kit is built as an
  # OCI image whose frontend validates the descriptor and solves the recipe. The
  # frontend pulls docker/sandbox-kit:3 from the `# syntax=` line automatically.
  # This job needs access to the claude BASE_IMAGE in sonar-claude.dockerfile and
  # may require a registry login; per the v3 migration guidance a fork without
  # registry access cannot complete the build and cannot run kit-tck.
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate kit descriptor and recipe
        # cacheonly drops the export, not the build: a malformed descriptor
        # fails in about a second, and a valid one goes on to solve the recipe.
        run: docker buildx build ./kit -f kit/sonar-claude.yaml --output type=cacheonly
      # - name: Conformance (kit-tck)
      #   run: |
      #     go install github.com/docker/sandbox-kit-spec/v3/cmd/kit-tck@latest
      #     docker buildx build ./kit -f kit/sonar-claude.yaml -t sonar-claude:0.1.0 \
      #       --output type=oci,dest=/tmp/sonar-claude-layout,tar=false
      #     kit-tck validate --layout /tmp/sonar-claude-layout 0.1.0
