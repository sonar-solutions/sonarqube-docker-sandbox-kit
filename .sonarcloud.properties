# Read by SonarQube Cloud automatic analysis, and only from the default branch:
# until this file is merged there, it does not change remote analysis.
# Project and organization identifiers are not committed.
#
# kit-mixin/sonar-kit/install.py is a byte-identical mirror of
# kit/sonar-kit/install.py: a v3 kit build context cannot reach a sibling
# directory, so each kit carries its own copy, and a host test enforces that
# they match. Only copy-detection is excluded, and only for the mirror. Both
# files are still analyzed for issues, and the canonical copy stays in
# duplication measurement.
sonar.cpd.exclusions=kit-mixin/sonar-kit/install.py
